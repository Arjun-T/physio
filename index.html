<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Physio Home Visit Booking</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <h1>PhysioConnect</h1>
    <nav>
      <a href="#book">Book a Visit</a>
      <a href="#register">Physio Register</a>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h2>Book a Physiotherapy Home Visit</h2>
    <p>Certified physiotherapists at your doorstep</p>
    <a href="#book" class="btn">Book Now</a>
  </section>

  <!-- Booking Section -->
  <section id="book" class="section">
    <h2>Book a Home Visit</h2>

    <form class="card">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your name" required />

      <label>Location</label>
      <input type="text" placeholder="Enter your address" required />

      <label>Date</label>
      <input type="date" required />

      <label>Time</label>
      <input type="time" required />

      <label>Condition</label>
      <select>
        <option>Back Pain</option>
        <option>Sports Injury</option>
        <option>Post Surgery Rehab</option>
        <option>Other</option>
      </select>

      <button type="submit" class="btn">Find Physiotherapist</button>
    </form>
  </section>

  <!-- Physio Registration -->
  <section id="register" class="section gray">
    <h2>Physiotherapist Registration</h2>

    <form class="card">
      <label>Full Name</label>
      <input type="text" required />

      <label>Email</label>
      <input type="email" required />

      <label>Qualification</label>
      <input type="text" placeholder="BPT / MPT" required />

      <label>Specialization</label>
      <input type="text" placeholder="Ortho, Neuro, Sports" />

      <label>Price per Session</label>
      <input type="number" placeholder="Amount" />

      <label>Service Radius (km)</label>
      <input type="number" />

      <button type="submit" class="btn">Register</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 PhysioConnect. All rights reserved.</p>
  </footer>

<script src="script.js"></script>
</body>
</html>
